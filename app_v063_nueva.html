  const anulados = todos.filter(e => e.anulado);
  // Una fila por evento, en columnas: Fecha · Descripción · Estado · Ejecutor · Pendientes · Acciones.
  const fila = (ev) => {
    const pendsEv = state.pendientes.filter(p => p.eventoOrigen === ev.id && !p.anulado);
    // Descripción: tipo + sellos (oficial/borrador/auto/lote) + folio + resultado + observación.
    const desc = el('td',{},
      el('div',{},
        el('strong',{}, etiquetaTipoEvento(ev)), ' ',
        ev.anulado ? el('span',{class:'badge anulado-badge'},'Anulado') :
          (ev.oficial==='Sí' ? el('span',{class:'badge ofic-si'},'Oficial') : el('span',{class:'badge ofic-no'},'Borrador')),
        ev.origen === 'conciliacion_auto' ? el('span',{class:'badge auto-badge',title:'Creado automáticamente al subir el maestro. Fecha = día 15 del mes.'},'🔗 Auto-maestro') : null,
        ev.origen === 'conciliacion' ? el('span',{class:'badge auto-badge',title:'Creado al aceptar un conflicto del maestro en Conciliación.'},'🔗 Conciliación') : null,
        ev.origen === 'masivo' ? el('span',{class:'badge ofic-no',title:'Registrado en lote desde MP del mes'},'⚡ Lote') : null,
        ev.folio ? el('span',{class:'pill'}, 'Folio: '+ev.folio) : null,
        ev.resultado ? el('span',{class:'pill'}, 'R: '+ev.resultado) : null
      ),
      ev.empresa ? el('div',{class:'muted',style:{fontSize:'12px',marginTop:'3px'}}, 'Empresa: '+ev.empresa) : null,
      ev.obs ? el('div',{class:'muted',style:{fontSize:'12px',marginTop:'4px',whiteSpace:'pre-wrap'}}, ev.obs) : null,
      ev.anulado ? el('div',{class:'muted',style:{fontSize:'12px',marginTop:'4px',color:'var(--noop)'}},
        '⊘ Anulado'+(ev.fechaAnulacion ? ' · '+new Date(ev.fechaAnulacion).toLocaleString('es-CL') : '')+(ev.motivoAnulacion ? ' · Motivo: '+ev.motivoAnulacion : '')
      ) : null
    );
    return el('tr',{class: ev.anulado?'ev-anulado':''},
      el('td',{style:{whiteSpace:'nowrap'}}, fmtFecha(ev.fecha),
        ev.ts ? el('small',{class:'muted',style:{display:'block',fontSize:'10px',marginTop:'2px'}}, 'creado '+new Date(ev.ts).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})) : null),
      desc,
      el('td',{}, (ev.tipo==='Mantención preventiva' && ev.resultado ? estadoMPFinal(ev.resultado, ev.estado) : ev.estado) || el('small',{class:'muted'},'—')),
      el('td',{}, ev.ejecutor || el('small',{class:'muted'},'—')),
      el('td',{}, pendsEv.length === 0
        ? el('small',{class:'muted'},'—')
        : el('div',{}, ...pendsEv.map(p => el('span',{class:'tag',title:'Abrir pendiente',style:{cursor:'pointer',display:'inline-block',margin:'2px 3px 0 0'},onclick:()=>abrirPendiente(p)},
            (TIPO_PENDIENTE[p.tipo]||p.tipo)+' · '+(ESTADO_PEND_LABEL[p.estado]||p.estado))))),
      el('td',{class:'actions',style:{whiteSpace:'nowrap'}},
        !ev.anulado ? el('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap'}},
          el('button',{class:'small',onclick:()=>nuevoPendiente({invDefault:ev.inv, eventoOrigen:ev.id}),title:'Agregar un pendiente ligado a este evento'},'➕ Pend.'),
          ev.oficial !== 'Sí' ? el('button',{class:'small primary',onclick:()=>oficializarEvento(ev),title:'Marcar como oficial'},'✓ Oficializar') : null,
          el('button',{class:'small',onclick:()=>editarEvento(ev),title:'Editar campos básicos'},'✎ Editar'),
          el('button',{class:'small danger',onclick:()=>anularEvento(ev),title:'Anular evento (revierte efectos)'},'⊘ Anular')
        ) : el('small',{class:'muted'},'—')
      )
    );
  };
  return el('div',{class:'section'},
    el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px',flexWrap:'wrap'}},
      el('h3',{style:{margin:'0'}},
        'Historial de eventos',
        anulados.length > 0
          ? el('small',{style:{fontWeight:'400',color:'var(--muted)',marginLeft:'8px',textTransform:'none',letterSpacing:'0'}},
              `${activos.length} activo${activos.length!==1?'s':''} · ${anulados.length} anulado${anulados.length!==1?'s':''}`)
          : null
      ),
      el('button',{class:'small',title:'Imprimir el registro de eventos (o guardarlo como PDF)',onclick:()=>imprimirHistorial(eq)},'🖨 Imprimir')
    ),
    el('div',{style:{overflow:'auto'}},
      el('table',{class:'data bitacora-grid'},
        el('thead',{}, el('tr',{}, ['Fecha','Descripción','Estado','Ejecutor','Pendientes','Acciones'].map(h=>el('th',{},h)))),
        el('tbody',{}, todos.length===0
          ? el('tr',{}, el('td',{colspan:'6',class:'empty small'},'Sin eventos registrados.'))
          : null, ...todos.map(fila))
      )

  );
}

function renderConflictosEquipo(eq, refresh){
  const lista = conflictosDe(eq.inv);
  if(lista.length === 0) return el('div',{class:'empty'},'Sin conflictos pendientes con el maestro.');
  function aplicarTodos(accion){
    if(lista.length > 5 && !confirm(`Aplicar "${accion}" a ${lista.length} conflictos de este equipo?`)) return;
    let n = 0, evsSint = 0;
    lista.forEach(c => {
      const r = resolverConflicto(c, accion, null, {skipSave:true});
      n++;
      if(r && r.eventoCreado) evsSint++;
    });
    save();
    refreshNav();
    toast(`${n} resueltos${evsSint>0?' · '+evsSint+' eventos creados':''}`, 'success');
    refresh();
  }
  const acciones = el('div',{style:{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}},
    el('span',{style:{flex:'1',fontSize:'13px',color:'var(--muted)'}}, `${lista.length} conflicto${lista.length>1?'s':''} pendiente${lista.length>1?'s':''}`),
    el('button',{class:'small primary',onclick:()=>aplicarTodos('aceptar_maestro')}, '✓ Aceptar maestro a todos'),
    el('button',{class:'small',onclick:()=>aplicarTodos('mantener_programa')}, '✗ Mantener programa en todos')
  );
  const cards = lista.map(c => {
    const card = el('div',{class:'conf-card '+(c.tipo==='equipo_nuevo'?'altas':c.tipo==='equipo_faltante'?'faltante':'urgent')});
    card.appendChild(el('div',{class:'hd'},
      el('div',{},
        el('div',{class:'title'}, nombreCampoConflicto(c)),
        el('div',{class:'meta'}, 'Detectado: '+new Date(c.fechaDeteccion).toLocaleString('es-CL'))
      ),
      el('span',{class:'badge '+(c.estado==='pendiente'?'noop':'st')}, c.estado)
    ));
    if(c.tipo === 'mp_diferencia'){
      card.appendChild(el('div',{class:'conf-diff'},
        el('div',{class:'prog'},
          el('div',{class:'lbl'},'En el programa'),
          el('div',{class:c.valorPrograma?'val':'val empty'}, c.valorPrograma || 'sin valor')
        ),
        el('div',{class:'mast'},
          el('div',{class:'lbl'},'En el maestro (Excel)'),
          el('div',{class:c.valorMaestro?'val':'val empty'}, c.valorMaestro || 'sin valor')
        )
      ));
    }
    card.appendChild(el('div',{class:'conf-actions'},
      el('button',{class:'primary small',onclick:()=>{const r=resolverConflicto(c,'aceptar_maestro');refresh();}},'✓ Aceptar maestro'),
      el('button',{class:'small',onclick:()=>{resolverConflicto(c,'mantener_programa');refresh();}},'✗ Mantener programa'),
      el('button',{class:'small ghost',onclick:()=>{resolverConflicto(c,'posponer');refresh();}},'⏸ Posponer')
    ));
    return card;
  });
  return el('div',{class:'section'}, acciones, el('div',{}, ...cards));
}

//---------------- ASIGNACIONES (consulta de MP por mes) ----------------
VIEWS.asignaciones = function(root, params){
  params = params || {};
  const today = new Date();
  const norm = normFiltro;
  const filtros = {};
  if(params.ejecutor) filtros.ejecutor = new Set([params.ejecutor]);
  // Filtro "drill-down" que llega desde el Resumen (estado de la MP / sin asignar).
  const drill = { estadoMP: params.estadoMP || '', sinAsignar: !!params.sinAsignar };
  let ordK=null, ordDir=1, rowsAll=[];

  const ANIOS = [today.getFullYear()-1, today.getFullYear(), today.getFullYear()+1];
  const selAnio = el('select',{}, ...ANIOS.map(a=>el('option',{value:a},String(a))));
  selAnio.value = (params.year && ANIOS.includes(+params.year)) ? +params.year : today.getFullYear();
  const selMes = el('select',{}, el('option',{value:'todos'},'Todos los meses'), ...MESES.map((m,i)=>el('option',{value:i}, m)));
  selMes.value = (params.mes!=null && MES_NUM[params.mes]!=null) ? String(MES_NUM[params.mes]) : String(today.getMonth());
  const search = el('input',{type:'search',placeholder:'Buscar por equipo, N° inventario, servicio…'});
  const thead=el('thead',{}); const tbody=el('tbody',{});
  const counter=el('div',{class:'muted',style:{fontSize:'12px',whiteSpace:'nowrap'}},'');
  const chipsBar=el('div',{class:'filters'});

  // Plantillas (requieren un mes específico; se deshabilitan con "Todos los meses").
  const btnDescPlantilla = el('button',{onclick:()=>descargarPlantillaMP(+selAnio.value, +selMes.value)},'📥 Descargar plantilla');
  const fileInputPlantilla = el('input',{type:'file',accept:'.xlsx',style:{display:'none'},onchange:async e=>{ const f=e.target.files[0]; if(!f) return; await subirPlantillaMP(f, +selAnio.value, +selMes.value); e.target.value=''; render(); }});
  const btnSubirPlantilla = el('button',{class:'primary',onclick:()=>fileInputPlantilla.click()},'📤 Subir plantilla');
  function syncPlantilla(){ const todos = selMes.value==='todos'; btnDescPlantilla.disabled=todos; btnSubirPlantilla.disabled=todos;
    const t = todos?'Elige un mes específico para usar la plantilla':''; btnDescPlantilla.title=t||'Descargar plantilla Excel del mes'; btnSubirPlantilla.title=t||'Subir plantilla con las asignaciones llenadas'; }

  function asignarEjecutor(keyMes, inv, ejec){
    state.asignacionesMP[keyMes] = state.asignacionesMP[keyMes] || {};
    state.asignacionesMP[keyMes][inv] = ejec || null;
    save();
  }

  const COLS = [
    {k:'mes',      l:'Mes',          g:r=>MESES[r.m], lista:true},
    {k:'carpeta',  l:'N° Carpeta',   g:r=> r.eq.carpeta!=null?String(r.eq.carpeta):''},
    {k:'inv',      l:'N° Inventario',g:r=>r.eq.inv||'', cell:r=>el('td',{}, el('strong',{}, r.eq.inv||'—'))},
    {k:'serie',    l:'Serie',        g:r=>r.eq.serie||''},
    {k:'equipo',   l:'Equipo',       g:r=>r.eq.equipo||'', lista:true},
    {k:'marca',    l:'Marca',        g:r=>r.eq.marca||'', lista:true},
    {k:'modelo',   l:'Modelo',       g:r=>r.eq.modelo||'', lista:true},
    {k:'servicio', l:'Servicio',     g:r=>r.eq.servicio||'', lista:true},
    {k:'unidad',   l:'Unidad',       g:r=>r.eq.unidad||'', lista:true},
    {k:'ubic',     l:'Ubicación',    g:r=>r.eq.ubic||'', lista:true},
    {k:'proc',     l:'Procedencia',  g:r=>r.eq.proc||'', lista:true},
    {k:'prog',     l:'Programación', g:r=>r.P||'', lista:true},
    {k:'resultado',l:'Resultado',    g:r=>r.R||'', lista:true},
    {k:'ejecutor', l:'Ejecutor (asignado)', g:r=>r.ejecutor||'', lista:true, cell:r=>{
      const sel = el('select',{onchange:e=>{ asignarEjecutor(r.keyMes, r.eq.inv, e.target.value); r.ejecutor = e.target.value||''; }},
        el('option',{value:''},'— sin asignar —'), ...EJECUTORES.map(x=>el('option',{value:x},x)));
      sel.value = r.ejecutor||''; return el('td',{}, sel);
    }},
    {k:'estadoReg',l:'Estado registro', g:r=>r.estadoReg||'', lista:true, cell:r=>el('td',{}, r.estadoReg? el('span',{class:'badge '+(r.estadoReg==='Oficial'?'ofic-si':'ofic-no')}, r.estadoReg) : el('small',{class:'muted'},'—'))}
  ];

  function buildRows(){
    state.equipos.forEach(recalcEstadoEquipo);
    const yy = +selAnio.value;
    const meses = selMes.value==='todos' ? MESES.map((_,i)=>i) : [ +selMes.value ];
    const rows=[];
    state.equipos.forEach(eq=>{
      if(eq.estado==='baja') return;
      meses.forEach(m=>{
        const P = ((eq.registro||{})[MESES[m]]||{}).P || (eq.prog||{})[MESES[m]] || '';
        const R = resultadoMPMes(eq, yy, m) || '';
        if(!P && !R) return; // solo filas con programación o resultado en ese mes
        const keyMes = `${yy}-${String(m+1).padStart(2,'0')}`;
        const ev = eventoMPMes(eq.inv, yy, m);
        rows.push({eq, m, keyMes, P, R, ejecutor: (state.asignacionesMP[keyMes]||{})[eq.inv] || '', estadoReg: ev?(ev.oficial==='Sí'?'Oficial':'Borrador'):''});
      });
    });
    return rows;
  }
  const valoresUnicos = c => [...new Set(rowsAll.map(r=>{const v=c.g(r); return v==null?'':String(v);}))].filter(v=>v!=='').sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));

  function buildHead(){
    cerrarColPopups();
    thead.innerHTML='';
    const trH=el('tr',{});
    COLS.forEach(c=> trH.appendChild(el('th',{class:'th-sort',title:'Ordenar por '+c.l,onclick:()=>{ if(ordK===c.k) ordDir=-ordDir; else {ordK=c.k;ordDir=1;} buildHead(); aplicar(); }}, c.l+(ordK===c.k?(ordDir>0?' ▲':' ▼'):''))));
    trH.appendChild(el('th',{},'Acciones'));
    thead.appendChild(trH);
    const trF=el('tr',{class:'filtros-col'});
    COLS.forEach(c=>{
      let ctrl;
      if(c.lista) ctrl=filtroColumnaExcel(c.l, valoresUnicos(c), filtros, c.k, aplicar);
      else ctrl=el('input',{type:'text',placeholder:'filtrar…',value:(typeof filtros[c.k]==='string'?filtros[c.k]:''),oninput:e=>{ filtros[c.k]=e.target.value; clearTimeout(window.__af); window.__af=setTimeout(aplicar,200); }});
      trF.appendChild(el('th',{}, ctrl));
    });
    trF.appendChild(el('th',{}));
    thead.appendChild(trF);
  }
  function renderChips(){
    chipsBar.innerHTML='';
    const etq={ejec:'Ejecutadas',pend:'Pendientes',reprog:'Reprogramadas (C1–C8)',otro:'Otro resultado'}[drill.estadoMP];
    const addChip=(k,v,onclr)=>chipsBar.appendChild(el('span',{class:'filter-chip'}, el('span',{class:'k'},k+':'), el('span',{},v), el('span',{class:'x',onclick:onclr},'×')));
    if(etq) addChip('Resumen', etq, ()=>{drill.estadoMP='';renderChips();aplicar();});
    if(drill.sinAsignar) addChip('Resumen','Sin asignar',()=>{drill.sinAsignar=false;renderChips();aplicar();});
  }
  function aplicar(){
    const tokens=norm(search.value.trim()).split(/\s+/).filter(Boolean);
    let list=rowsAll.filter(r=>{
      if(drill.estadoMP==='ejec' && r.R!=='Si') return false;
      if(drill.estadoMP==='pend' && r.R) return false;
      if(drill.estadoMP==='reprog' && !/^C[1-8]$/.test(r.R||'')) return false;
      if(drill.estadoMP==='otro' && (!r.R || r.R==='Si' || /^C[1-8]$/.test(r.R))) return false;
      if(drill.sinAsignar && r.ejecutor) return false;
      if(tokens.length){ const hay=[r.eq.inv,r.eq.serie,r.eq.equipo,r.eq.marca,r.eq.modelo,r.eq.servicio,r.eq.unidad].map(norm).join(' '); if(!tokens.every(t=>hay.includes(t))) return false; }
      for(const c of COLS){ const fv=filtros[c.k]; if(!fv) continue; const val=c.g(r);
        if(c.lista){ if(fv instanceof Set && fv.size>0 && !fv.has(String(val))) return false; }
        else { if(!norm(val).includes(norm(fv))) return false; } }
      return true;
    });
    if(ordK){ const c=COLS.find(x=>x.k===ordK); list.sort((a,b)=> String(c.g(a)).localeCompare(String(c.g(b)),'es',{numeric:true})*ordDir); }
    tbody.innerHTML='';
    list.slice(0,1000).forEach(r=>{
      const tr=el('tr',{});
      COLS.forEach(c=> tr.appendChild(c.cell ? c.cell(r) : el('td',{}, c.g(r)||'—')));
      tr.appendChild(el('td',{class:'actions',style:{whiteSpace:'nowrap'}},
        el('button',{class:'small primary',onclick:()=>mpRapida({invDefault:r.eq.inv, fechaDefault:fechaSugeridaMP(+selAnio.value, r.m)})},'➕ MP'),
        el('button',{class:'small ghost',onclick:()=>navigate('equipo',{inv:r.eq.inv})},'Ficha')
      ));
      tbody.appendChild(tr);
    });
    counter.textContent = `${list.length} registros${list.length>1000?' (mostrando 1000)':''}`;
    renderChips();
  }
  function render(){ syncPlantilla(); rowsAll = buildRows(); buildHead(); aplicar(); }
  selAnio.onchange = render; selMes.onchange = render;
  search.addEventListener('input', ()=>{ clearTimeout(window.__as); window.__as=setTimeout(aplicar,200); });

  root.appendChild(el('div',{class:'view view-full'},
    el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',flexWrap:'wrap',gap:'10px'}},
      el('h2',{},'Asignaciones'),
      el('div',{style:{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}},
        el('span',{class:'muted',style:{fontSize:'12px'}},'Año'), selAnio,
        el('span',{class:'muted',style:{fontSize:'12px'}},'Mes'), selMes,
        btnDescPlantilla, btnSubirPlantilla, fileInputPlantilla
      )
    ),
    el('div',{class:'subtitle'},'Programación, resultado y ejecutor ASIGNADO de la MP por equipo y mes. Asigna el ejecutor en su columna; descarga/sube la plantilla del mes; filtra por columna o por mes ("Todos los meses").'),
    el('div',{class:'toolbar'}, el('div',{class:'grow'},search), counter),
    chipsBar,
    el('div',{class:'eq-grid-wrap',style:{overflow:'auto',border:'1px solid var(--border)',borderRadius:'10px'}},
      el('table',{class:'data eq-grid buscar-grid',style:{border:'none'}}, thead, tbody)
    )
  ));
  render();
};

VIEWS.ciclos = function(root, params){
  const tab = el('div',{class:'tabs'});

    tab.innerHTML = '';
    [['abierto',`Abiertos (${state.ciclos.filter(c=>c.estado==='abierto').length})`],['cerrado',`Cerrados (${state.ciclos.filter(c=>c.estado==='cerrado').length})`]].forEach(([k,l])=>{
      tab.appendChild(el('button',{class:modo===k?'active':'',onclick:()=>{modo=k;render();}},l));
    });
    body.innerHTML = '';
    const lista = state.ciclos.filter(c=>c.estado===modo).sort((a,b)=>(b.fechaApertura||'').localeCompare(a.fechaApertura||''));
    if(lista.length===0){
      body.appendChild(el('div',{class:'empty'},'Sin ciclos '+modo+'s.'));
      return;
    }
    const tbl = el('table',{class:'data'},
      el('thead',{}, el('tr',{}, ['Folio SIGEM','Equipo','Servicio','Apertura','Cierre','Ingeniero','Acciones'].map(h=>el('th',{},h)))),
      el('tbody',{}, ...lista.map(c=>{
        const eq = findEquipo(c.inv);
        return el('tr',{},
          el('td',{}, el('strong',{}, c.folio)),
          el('td',{}, eq ? `${eq.equipo} · ${c.inv}` : c.inv),
          el('td',{}, eq?eq.servicio:'—'),
          el('td',{}, fmtFecha(c.fechaApertura)),
          el('td',{}, fmtFecha(c.fechaCierre)),
          el('td',{}, c.ingenieroAsignado||'—'),
          el('td',{class:'actions'},
            el('button',{class:'small',onclick:()=>navigate('equipo',{inv:c.inv})},'Ficha'),
            c.estado==='abierto' ? el('button',{class:'small primary',onclick:()=>cerrarCicloManual(c)},'Cerrar'): null
          )
        );
      }))

    body.appendChild(tbl);
  }

  root.appendChild(el('div',{class:'view'},
    el('h2',{},'Ciclos correctivos'),
    tab, body
  ));
  render();
};

//---------------- PENDIENTES ----------------
VIEWS.pendientes = function(root, params){
  // Planilla a pantalla completa con filtros por columna (estilo Excel) y barra de búsqueda.
  const COLS = [
    {k:'carpeta',  l:'N° Carpeta', g:p=>{const eq=findEquipo(p.inv); return eq&&eq.carpeta!=null?String(eq.carpeta):'';}},
    {k:'servicio', l:'Servicio',   g:p=>p.servicio||((findEquipo(p.inv)||{}).servicio)||'', lista:true},
    {k:'equipo',   l:'Equipo',     g:p=>p.equipo||((findEquipo(p.inv)||{}).equipo)||'', lista:true},
    {k:'inv',      l:'N° Inventario', g:p=>p.inv||'', cell:p=>el('td',{}, el('strong',{}, p.inv||'—'))},
    {k:'tipo',     l:'Tipo',       g:p=>TIPO_PENDIENTE[p.tipo]||p.tipo||'', lista:true, cell:p=>el('td',{}, el('span',{class:'tag'}, TIPO_PENDIENTE[p.tipo]||p.tipo))},
    {k:'desc',     l:'Descripción',g:p=>p.desc||'', cell:p=>el('td',{style:{maxWidth:'380px'}}, p.desc||'—')},
    {k:'ejecutor', l:'Ejecutor',   g:p=>p.ejecutor||'', lista:true},
    {k:'fechaComp',l:'Compromiso', g:p=>p.fechaComp||'', cell:p=>{const venc=p.fechaComp&&p.fechaComp<hoyLocal()&&p.estado!=='cerrado'; return el('td',{style:venc?{color:'var(--noop)',fontWeight:'600',whiteSpace:'nowrap'}:{whiteSpace:'nowrap'}}, fmtFecha(p.fechaComp));}},
    {k:'estado',   l:'Estado',     g:p=>ESTADO_PEND_LABEL[p.estado]||p.estado||'', lista:true, cell:p=>el('td',{}, badgePend(p.estado))}
  ];
  const filtros = {};
  if(params.tipo)     filtros.tipo     = new Set([TIPO_PENDIENTE[params.tipo]||params.tipo]);
  if(params.estado)   filtros.estado   = new Set([ESTADO_PEND_LABEL[params.estado]||params.estado]);
  if(params.ejecutor) filtros.ejecutor = new Set([params.ejecutor]);
  if(params.servicio) filtros.servicio = new Set([params.servicio]);
  let ordK=null, ordDir=1;
  const norm = normFiltro;
  const search = el('input',{type:'search',placeholder:'Buscar por equipo, N° inventario o descripción…'});
  const thead = el('thead',{}); const tbody = el('tbody',{});
  const counter = el('div',{class:'muted',style:{fontSize:'12px',whiteSpace:'nowrap'}},'');
  const valoresUnicos = c => [...new Set(state.pendientes.filter(p=>!p.anulado).map(p=>{const v=c.g(p); return v==null?'':String(v);}))].filter(v=>v!=='').sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));

  function buildHead(){
    cerrarColPopups();
    thead.innerHTML='';
    const trH = el('tr',{});
    COLS.forEach(c=> trH.appendChild(el('th',{class:'th-sort',title:'Ordenar por '+c.l,onclick:()=>{ if(ordK===c.k) ordDir=-ordDir; else {ordK=c.k;ordDir=1;} render(); }}, c.l+(ordK===c.k?(ordDir>0?' ▲':' ▼'):''))));
    trH.appendChild(el('th',{},'Acciones'));
    thead.appendChild(trH);
    const trF = el('tr',{class:'filtros-col'});
    COLS.forEach(c=>{
      let ctrl;
      if(c.lista) ctrl = filtroColumnaExcel(c.l, valoresUnicos(c), filtros, c.k, aplicar);
      else ctrl = el('input',{type:'text',placeholder:'filtrar…',value:(typeof filtros[c.k]==='string'?filtros[c.k]:''),oninput:e=>{ filtros[c.k]=e.target.value; clearTimeout(window.__pf); window.__pf=setTimeout(aplicar,200); }});
      trF.appendChild(el('th',{}, ctrl));
    });
    trF.appendChild(el('th',{}));
    thead.appendChild(trF);
  }
  function aplicar(){
    const tokens = norm(search.value.trim()).split(/\s+/).filter(Boolean);
    let list = state.pendientes.filter(p=>{
      if(p.anulado) return false;
      if(tokens.length){ const hay=[p.inv,p.equipo,p.servicio,p.desc,p.ejecutor,TIPO_PENDIENTE[p.tipo]].map(norm).join(' '); if(!tokens.every(t=>hay.includes(t))) return false; }
      for(const c of COLS){ const fv=filtros[c.k]; if(!fv) continue; const val=c.g(p);
        if(c.lista){ if(fv instanceof Set && fv.size>0 && !fv.has(String(val))) return false; }
        else { if(!norm(val).includes(norm(fv))) return false; } }
      return true;
    });
    if(ordK){ const c=COLS.find(x=>x.k===ordK); list.sort((a,b)=> String(c.g(a)).localeCompare(String(c.g(b)),'es',{numeric:true})*ordDir); }
    else list.sort((a,b)=>(a.fechaComp||'9999').localeCompare(b.fechaComp||'9999'));
    tbody.innerHTML='';
    list.forEach(p=>{
      const tr = el('tr',{});
      COLS.forEach(c=> tr.appendChild(c.cell ? c.cell(p) : el('td',{}, c.g(p)||'—')));
      tr.appendChild(el('td',{class:'actions',style:{whiteSpace:'nowrap'}},
        el('button',{class:'small',onclick:()=>abrirPendiente(p)},'Ver'),
        p.estado==='no_iniciado' ? el('button',{class:'small',onclick:()=>cambiarEstadoPend(p,'en_proceso')},'Empezar') : null,
        p.estado!=='cerrado' ? el('button',{class:'small primary',onclick:()=>cerrarPendiente(p)},'Resolver') : null,
        el('button',{class:'small ghost',onclick:()=>navigate('equipo',{inv:p.inv})},'Ficha')
      ));
      tbody.appendChild(tr);
    });
    counter.textContent = `${list.length} pendientes`;
  }
  function render(){ buildHead(); aplicar(); }
  search.addEventListener('input', ()=>{ clearTimeout(window.__ps); window.__ps=setTimeout(aplicar,200); });
  root.appendChild(el('div',{class:'view view-full'},
    el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',flexWrap:'wrap',gap:'10px'}},
      el('h2',{},'Pendientes'),
      el('button',{class:'primary',onclick:()=>nuevoPendiente({})},'➕ Nuevo pendiente')
    ),
    el('div',{class:'toolbar'}, el('div',{class:'grow'},search), counter),
    el('div',{class:'eq-grid-wrap',style:{overflow:'auto',border:'1px solid var(--border)',borderRadius:'10px'}},
      el('table',{class:'data eq-grid buscar-grid',style:{border:'none'}}, thead, tbody)
    )
  ));
  render();
};

      }))
